services:
  hbbs:
    image: ghcr.io/atishoo/capylink-server:ultrapro
    container_name: hbbs
    command: hbbs -r hbbr:21117
    environment:
      ENABLE_TCP_REGISTER: ${ENABLE_TCP_REGISTER:-Y}
      MUST_LOGIN: ${MUST_LOGIN:-N}
      CAPYLINK_API_JWT_KEY: ${CAPYLINK_API_JWT_KEY:-}
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ./data/server:/data
    networks:
      - capylink-net
    depends_on:
      hbbr:
        condition: service_started
    restart: unless-stopped

  hbbr:
    image: ghcr.io/atishoo/capylink-server:ultrapro
    container_name: hbbr
    command: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - ./data/server:/data
    networks:
      - capylink-net
    restart: unless-stopped

  capylink-api:
    image: ghcr.io/atishoo/capylink-api:ultrapro
    container_name: capylink-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CAPYLINK_API_LANG: ${CAPYLINK_API_LANG:-zh-CN}
      CAPYLINK_API_CAPYLINK_ID_SERVER: ${CAPYLINK_ID_SERVER:?set CAPYLINK_ID_SERVER}
      CAPYLINK_API_CAPYLINK_RELAY_SERVER: ${CAPYLINK_RELAY_SERVER:?set CAPYLINK_RELAY_SERVER}
      CAPYLINK_API_CAPYLINK_API_SERVER: ${CAPYLINK_API_SERVER:?set CAPYLINK_API_SERVER}
      CAPYLINK_API_CAPYLINK_KEY_FILE: /server-data/id_ed25519.pub
      CAPYLINK_API_CAPYLINK_WS_HOST: ${CAPYLINK_WS_HOST:-}
      CAPYLINK_API_APP_ADMIN_ORIGINS: ${CAPYLINK_ADMIN_ORIGINS:-}
      CAPYLINK_API_JWT_KEY: ${CAPYLINK_API_JWT_KEY:-}
    ports:
      - "21114:21114"
    volumes:
      - ./data/api:/app/data
      - ./data/api-runtime:/app/runtime
      - ./data/server:/server-data:ro
    networks:
      - capylink-net
    depends_on:
      hbbs:
        condition: service_healthy
      hbbr:
        condition: service_healthy
    restart: unless-stopped

networks:
  capylink-net:
    driver: bridge
