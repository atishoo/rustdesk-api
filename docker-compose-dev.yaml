services:
  capylink-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      additional_contexts:
        capylink-web: ../rustdesk-web
      args:
        COUNTRY: CN
        VITE_NATIVE_CLIENT_SCHEME: ${VITE_NATIVE_CLIENT_SCHEME:-capylink}
    # image: capylink-api:local
    container_name: capylink-api
    environment:
      - TZ=Asia/Shanghai
      - CAPYLINK_API_CAPYLINK_ID_SERVER=192.168.1.66:21116
      - CAPYLINK_API_CAPYLINK_RELAY_SERVER=192.168.1.66:21117
      - CAPYLINK_API_CAPYLINK_API_SERVER=http://127.0.0.1:21114
      - CAPYLINK_API_CAPYLINK_KEY=123456789
    ports:
      - 21114:21114
    volumes:
      - ./data/capylink/api:/app/data #将数据库挂载出来方便备份
      - ./conf:/app/conf # config
      # - ./resources:/app/resources # 静态资源
    restart: unless-stopped
