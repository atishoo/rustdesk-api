services:
  hbbs:
    image: ghcr.io/atishoo/rustdesk-server:ultrapro
    container_name: hbbs
    command: hbbs -r hbbr:21117
    environment:
      ENABLE_TCP_REGISTER: ${ENABLE_TCP_REGISTER:-Y}
      MUST_LOGIN: ${MUST_LOGIN:-N}
      RUSTDESK_API_JWT_KEY: ${RUSTDESK_API_JWT_KEY:-}
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ./data/server:/data
    networks:
      - rustdesk-net
    depends_on:
      hbbr:
        condition: service_started
    restart: unless-stopped

  hbbr:
    image: ghcr.io/atishoo/rustdesk-server:ultrapro
    container_name: hbbr
    command: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - ./data/server:/data
    networks:
      - rustdesk-net
    restart: unless-stopped

  rustdesk-api:
    image: ghcr.io/atishoo/rustdesk-api:ultrapro
    container_name: rustdesk-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RUSTDESK_API_LANG: ${RUSTDESK_API_LANG:-zh-CN}
      RUSTDESK_API_RUSTDESK_ID_SERVER: ${RUSTDESK_ID_SERVER:?set RUSTDESK_ID_SERVER}
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: ${RUSTDESK_RELAY_SERVER:?set RUSTDESK_RELAY_SERVER}
      RUSTDESK_API_RUSTDESK_API_SERVER: ${RUSTDESK_API_SERVER:?set RUSTDESK_API_SERVER}
      RUSTDESK_API_RUSTDESK_KEY_FILE: /server-data/id_ed25519.pub
      RUSTDESK_API_RUSTDESK_WS_HOST: ${RUSTDESK_WS_HOST:-}
      RUSTDESK_API_APP_ADMIN_ORIGINS: ${RUSTDESK_ADMIN_ORIGINS:-}
      RUSTDESK_API_JWT_KEY: ${RUSTDESK_API_JWT_KEY:-}
    ports:
      - "21114:21114"
    volumes:
      - ./data/api:/app/data
      - ./data/api-runtime:/app/runtime
      - ./data/server:/server-data:ro
    networks:
      - rustdesk-net
    depends_on:
      hbbs:
        condition: service_healthy
      hbbr:
        condition: service_healthy
    restart: unless-stopped

networks:
  rustdesk-net:
    driver: bridge
